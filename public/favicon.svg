<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A book with a cover, which is what this tool is about. Theme-aware: an SVG favicon may carry
    its own media query, so the mark stays visible against a dark browser chrome instead of
    becoming a near-black shape on a near-black tab strip.
  -->
  <style>
    svg { --ink: #111111; --canvas: #f7f6f3; }
    @media (prefers-color-scheme: dark) {
      svg { --ink: #f2f1ee; --canvas: #191918; }
    }
  </style>
  <rect x="7" y="3" width="18" height="26" rx="2.5" fill="var(--ink)"/>
  <rect x="10.5" y="19.6" width="11" height="1.9" rx="0.95" fill="var(--canvas)"/>
  <rect x="10.5" y="23.3" width="7" height="1.9" rx="0.95" fill="var(--canvas)"/>
</svg>
