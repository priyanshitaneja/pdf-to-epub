# Build the app and publish it to GitHub Pages on every push to master.
#
# The app is a fully static SPA - all conversion happens in the browser - so Pages is a complete
# host for it, with no server side to run.
name: Deploy

on:
  push:
    branches: [master]
  # Allows a manual run from the Actions tab without pushing.
  workflow_dispatch:

# Pages deployment needs these; `contents: read` is enough because nothing is committed back.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; keep the newest and cancel the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck, lint and the full suite gate the deploy: a broken build should not ship.
      - run: npx tsc -b
      - run: npm run lint
      - run: npm run test

      - name: Build
        # Pages serves a project site from /<repo>/, so the base has to match or every asset
        # 404s. The app reads import.meta.env.BASE_URL, so this is the only place it is set.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
